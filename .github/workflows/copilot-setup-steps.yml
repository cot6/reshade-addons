---
name: Copilot Setup Steps

'on':
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      # Intentional for Windows Copilot setup.
      # Copilot's integrated firewall is not compatible with Windows runners.
      - name: Disable Windows Firewall
        shell: pwsh
        run: |
          Set-NetFirewallProfile `
            -Profile Domain,Public,Private `
            -Enabled False

      - name: Checkout repository
        uses: actions/checkout@v4
